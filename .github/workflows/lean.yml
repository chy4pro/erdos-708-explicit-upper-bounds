name: erdos708-lean
on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: lean --version
      - name: Mathlib cache
        run: lake exe cache get
      - name: Restore project build cache
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: erdos708-build-${{ github.run_id }}
          restore-keys: erdos708-build-
      - name: Add swap (the H97 L=256/512 certificate files are 2-34 MB of Lean source)
        working-directory: .
        run: |
          free -g
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile2 && sudo chmod 600 /mnt/swapfile2
          sudo mkswap /mnt/swapfile2 && sudo swapon /mnt/swapfile2
          free -g
      - name: Prebuild large certificate modules one at a time
        run: |
          set -o pipefail
          for j in 4 5 6 7; do for L in 256 512; do for s in Rows ""; do
            m=Erdos708.H97.Proofs.Numeric${j}_${L}${s}
            echo "== $m $(date -u +%T)"; lake build "$m" 2>&1 | tail -3 | tee -a prebuild.log
            free -m | head -2
          done; done; done
      - name: Build (includes FinalCheck axiom guards)
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: FinalCheck (success = no output)
        run: |
          set -o pipefail
          lake env lean Erdos708/FinalCheck.lean 2>&1 | tee finalcheck.log
          test ! -s finalcheck.log
      - name: No sorry / native_decide in the build closure
        run: |
          ! grep -n "declaration uses 'sorry'" build.log
      - name: Save project build cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: lean/.lake/build
          key: erdos708-build-${{ github.run_id }}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            lean/prebuild.log
            lean/build.log
            lean/finalcheck.log
